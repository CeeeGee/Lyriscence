<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
:root { --g1: #ffaa3c; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; user-select: none;
  font-family: 'Nunito', 'Segoe UI', sans-serif; color: #fff; }
#fx { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 20; }
#card { position: absolute; inset: 30px; border-radius: 24px; padding: 14px 16px 12px;
  display: flex; flex-direction: column; gap: 10px;
  background: rgba(16,16,16,.8); backdrop-filter: blur(20px) saturate(170%);
  border: 1px solid rgba(255,255,255,.1);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.28); }
.top { display: flex; gap: 12px; align-items: center; -webkit-app-region: drag; }   /* drag the card by its top; everything else is clickable */
#art { width: 64px; height: 64px; border-radius: 14px; object-fit: cover; background: #222; flex: none; }
.t { flex: 1; min-width: 0; padding-right: 22px; }
#title { font-weight: 900; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#artist { font-size: 12px; font-weight: 700; opacity: .6; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#bar { height: 4px; border-radius: 4px; background: rgba(255,255,255,.16); overflow: hidden; }
#fill { height: 100%; width: 0; background: var(--g1); border-radius: 4px; }
.ctl { display: flex; justify-content: center; align-items: center; gap: 14px; -webkit-app-region: no-drag; }
.ctl button { border: 0; background: rgba(255,255,255,.1); color: #fff; width: 38px; height: 38px; border-radius: 50%;
  cursor: pointer; display: grid; place-items: center; padding: 0; transition: transform .12s, background .15s; }
.ctl button:hover { background: rgba(255,255,255,.22); }
.ctl button:active { transform: scale(.9); }
.ctl button.play { width: 46px; height: 46px; background: var(--g1); color: #000; }
.ctl button.play:hover { background: var(--g1); filter: brightness(1.12); }
.ctl svg { width: 18px; height: 18px; fill: currentColor; }
#fxbtn { position: absolute; top: 10px; right: 12px; width: 28px; height: 28px; border: 0; border-radius: 9px; padding: 0;
  display: grid; place-items: center; cursor: pointer; color: #fff; background: rgba(255,255,255,.1);
  -webkit-app-region: no-drag; transition: background .15s, color .15s; z-index: 3; }
#fxbtn:hover { background: rgba(255,255,255,.22); }
#fxbtn[data-mode=move] { color: var(--g1); }
#fxbtn[data-mode=off] { opacity: .5; }
#fxbtn svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
</style></head>
<body>
  <canvas id="fx"></canvas>
  <div id="card">
    <button id="fxbtn" title="Light"><svg viewBox="0 0 24 24"><path d=""/></svg></button>
    <div class="top">
      <img id="art">
      <div class="t"><div id="title"></div><div id="artist"></div></div>
    </div>
    <div id="bar"><div id="fill"></div></div>
    <div class="ctl">
      <button id="prev" title="Previous"><svg viewBox="0 0 24 24"><path d="M6 5h2v14H6zM20 5v14L9 12z"/></svg></button>
      <button id="toggle" class="play" title="Play / pause"><svg id="ico" viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button>
      <button id="next" title="Next"><svg viewBox="0 0 24 24"><path d="M16 5h2v14h-2zM4 5v14l11-7z"/></svg></button>
    </div>
  </div>
  <script src="theme.js"></script>
  <script src="glow.js"></script>
  <script>
    const $ = id => document.getElementById(id);
    const PAUSE = 'M6 4h4v16H6zM14 4h4v16h-4z', PLAY = 'M7 4v16l13-8z';
    const glow = AmbientGlow({ canvas: $('fx'), panel: $('card'), speed: 150 });
    GlowToggle({ button: $('fxbtn'), glow, storeKey: 'rl-card-glow' });
    let lastArt = '', lastPlaying = null;
    $('prev').onclick = () => window.api.cmd('prev');
    $('next').onclick = () => window.api.cmd('next');
    $('toggle').onclick = () => window.api.cmd('toggle');
    window.api.onMood(h => setMoodHue(h));
    window.api.onMedia(m => {
      $('title').textContent = m.title || '';
      $('artist').textContent = m.artist || '';
      applyMediaTheme(m);
      glow.setPlaying(m.playing);
      if (m.art && m.art !== lastArt) { lastArt = m.art; $('art').src = 'data:image/jpeg;base64,' + m.art; }
      $('fill').style.width = m.duration > 0 ? (100 * m.position / m.duration) + '%' : '0';
      if (m.playing !== lastPlaying) {
        lastPlaying = m.playing;
        $('ico').firstElementChild.setAttribute('d', m.playing ? PAUSE : PLAY);
      }
    });
  </script>
</body></html>
